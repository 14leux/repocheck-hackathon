<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoCheck Demo</title>
<meta name="description" content="Explore verified RepoCheck security reports with exact cross-file evidence.">
<style>
:root{--bg:#111412;--panel:#191d1a;--panel2:#202621;--line:#344238;--ink:#f2f5ef;--muted:#a4b0a5;--mint:#76d9b9;--mint2:#173a31;--red:#ff9b83;--red2:#49231d;--gold:#f1c978;--gold2:#3a2e18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}a{color:var(--mint)}main{max-width:1120px;margin:auto;padding:0 24px 72px}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}.brand{font-weight:800;color:var(--ink);text-decoration:none}.navlinks{display:flex;gap:18px;font-size:13px}.hero{padding:58px 0 34px;max-width:730px}.eyebrow{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.03;letter-spacing:-.045em;margin:12px 0 16px}.hero p{color:var(--muted);font-size:18px;max-width:58ch}.layout{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}.picker,.report{background:var(--panel);border:1px solid var(--line);border-radius:16px}.picker{padding:10px}.picker button{width:100%;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--ink);padding:14px 13px;cursor:pointer;font:inherit}.picker button:hover,.picker button.selected{background:var(--mint2);color:var(--mint)}.picker small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.report{padding:24px;min-height:430px}.report h2{margin:0 0 4px;font-size:25px}.meta{color:var(--muted);font-size:12px;margin-bottom:18px}.badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;letter-spacing:.04em}.danger{background:var(--red2);color:var(--red)}.clean{background:var(--mint2);color:var(--mint)}.failed{background:var(--gold2);color:var(--gold)}.summary{font-size:17px;margin:18px 0}.finding{border-top:1px solid var(--line);padding:15px 0}.finding strong{font-size:12px;text-transform:uppercase;letter-spacing:.06em}.finding p{margin:6px 0;color:var(--muted)}details{border-top:1px solid var(--line);padding-top:9px;margin-top:10px}summary{cursor:pointer;color:var(--mint);font-size:13px}.quote{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px;margin-top:8px;font:12px/1.45 ui-monospace,monospace;color:var(--ink);white-space:pre-wrap}.notice{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}.notice strong{color:var(--ink)}.back{display:inline-block;margin-top:26px;font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr}.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.picker button{font-size:12px;padding:11px}.picker small{display:none}}
</style>
</head>
<body><main>
<nav class="nav"><a class="brand" href="/">Dr. RepoCheck</a><div class="navlinks"><a href="/how-it-works">How it works</a><a href="https://github.com/14leux/repocheck-hackathon">GitHub</a></div></nav>
<header class="hero"><div class="eyebrow">Verified demo</div><h1>See the evidence, not just the verdict.</h1><p>Choose a case to see how RepoCheck traces behavior across files, preserves uncertainty, and explains what the user should do next.</p></header>
<section class="layout"><aside class="picker" aria-label="Demo cases"><button class="selected" data-case="credential-disguised-report">Credential in a report field<small>Cross-file exfiltration</small></button><button data-case="reviewer-note-sanity-a">Manipulated reviewer<small>Instruction override</small></button><button data-case="task-digest-v1">Conditional installer<small>Fetch and execute</small></button></aside><article class="report" id="report"><p>Loading verified report…</p></article></section>
<a class="back" href="/">← Try your own public GitHub link</a>
</main>
<script>
const report=document.getElementById('report');
const labels={EXCEEDS_SCOPE:['danger','EXCEEDS SCOPE','The implementation does more than the stated authorization allows.'],NO_EXCESS_FOUND_IN_SCOPE:['clean','NO EXCESS FOUND','No excess access was found in the inspected scope.'],ANALYSIS_FAILED:['failed','ANALYSIS FAILED','The deep review did not produce a reliable result. This is not approval.']};
function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(data){const [klass,label,summary]=labels[data.disposition]||labels.ANALYSIS_FAILED;let html=`<h2>${esc(data.case_id||'Verified case')}</h2><div class="meta">${esc(data.run_record?.model||data.model_key||'model')} · verified ${esc(data.verified_live_at||'timestamp recorded')}</div><span class="badge ${klass}">${label}</span><p class="summary">${summary}</p>`;(data.findings||[]).forEach((f,i)=>{html+=`<div class="finding"><strong>${esc(f.severity||'review')} · finding ${i+1}</strong><p>${esc(f.summary||'Review this finding.')}</p><details><summary>Show evidence (${(f.evidence||[]).length} citations)</summary>`;(f.evidence||[]).forEach(e=>html+=`<span class="quote">${esc(e.path)}: “${esc(e.quote)}”</span>`);html+='</details></div>'});if(!data.findings?.length)html+='<div class="finding"><strong>Within inspected scope</strong><p>No excess access was found in the inspected files.</p></div>';html+=`<div class="notice"><strong>What to do next</strong><br>${data.disposition==='EXCEEDS_SCOPE'?'Do not install it. Review the cited files or choose another source.':'Treat this as evidence about the inspected snapshot, not a safety guarantee.'}</div>`;return html}
async function load(id){report.innerHTML='<p>Loading verified report…</p>';try{const r=await fetch('/api/scan?case='+encodeURIComponent(id)+'&model=comparator');const d=await r.json();report.innerHTML=render(d)}catch(e){report.innerHTML='<p>Could not load this verified report.</p>'}}
document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-case]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');load(b.dataset.case)}));
load('credential-disguised-report');
</script></body></html>
